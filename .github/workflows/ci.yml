name: CI
on: [push, pull_request]

env:
  PRACTICE: PR06
  KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w12-525e86f818ff.tar.gz
  KIT_SHA256: 525e86f818ffed166e7f7b67cc87fdd3f3ea840d13aa90e76bde9fda0f3c9c5a

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download pinned course kit
        run: |
          archive="$RUNNER_TEMP/kit.tar.gz"
          curl -fL "$KIT_URL" -o "$archive"
          echo "$KIT_SHA256  $archive" | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf "$archive" -C .course-kit
          cat .course-kit/v1/VERSION

      - name: Validate JSON in evidence
        run: |
          shopt -s globstar nullglob
          for f in evidence/**/*.json; do
            echo "json: $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Course checker
        run: |
          dir="evidence/${PRACTICE,,}"
          if [ -f "$dir/report.json" ]; then
            python3 .course-kit/v1/tools/check_practice.py "$PRACTICE" --submission .
          else
            echo "No $dir/report.json yet (implementation commit) — skipping checker"
          fi

  ros-build:
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ros-lyrical-turtlesim \
            ros-lyrical-turtlesim-msgs \
            ros-lyrical-ros2bag \
            ros-lyrical-rosbag2-storage-mcap \
            ros-lyrical-ament-copyright \
            ros-lyrical-ament-flake8 \
            ros-lyrical-ament-pep257 \
            ros-lyrical-ament-mypy \
            ros-lyrical-ament-xmllint \
            ros-lyrical-ament-cmake-pytest \
            ros-lyrical-robot-state-publisher \
            ros-lyrical-rviz2 \
            ros-lyrical-urdfdom \
            ros-lyrical-xacro \
            python3-pytest

      - name: Syntax check of launch file
        run: |
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py \
            src/course_bringup/launch/patrol.launch.py \
            src/course_description/launch/vehicle.launch.py

      - name: Build packages
        run: |
          source /opt/ros/lyrical/setup.bash
          set -o pipefail
          colcon build --symlink-install \
            2>&1 | tee "$RUNNER_TEMP/build.txt"

      - name: Check installed sim.launch.py
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          prefix="$(ros2 pkg prefix turtle_bringup)"
          echo "prefix: $prefix"
          case "$prefix" in
            "$PWD"/install/*) ;;
            *) echo "turtle_bringup найден не в install этого workspace"; exit 1 ;;
          esac
          launch_file="$prefix/share/turtle_bringup/launch/sim.launch.py"
          ls -l "$launch_file"
          test -f "$launch_file"
          # Разбирает launch-описание без запуска нод: GUI в CI не нужен
          ros2 launch turtle_bringup sim.launch.py --show-args
          ros2 launch course_bringup patrol.launch.py --show-args
          ros2 launch course_description vehicle.launch.py --show-args

      - name: Check expanded vehicle URDF
        run: |
          source /opt/ros/lyrical/setup.bash
          xacro src/course_description/urdf/vehicle.urdf.xacro > "$RUNNER_TEMP/vehicle.urdf"
          check_urdf "$RUNNER_TEMP/vehicle.urdf"

      - name: Package tests
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon test --packages-select turtle_bringup course_bringup course_description
          colcon test-result --verbose

      - name: Patrol tests
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          python3 -m pytest src/patrol/test
